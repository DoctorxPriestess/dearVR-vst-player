# Build JVM. 2 GB is enough for this project (one module, no Kotlin compilation).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build cache + parallel execution: the native build and the Java compilation are
# independent, and repeated debug builds reuse the CMake output.
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Optional: if the dependency repositories are only reachable through a proxy,
# uncomment the four lines below (and adjust host/port). Keeping them out of the
# build by default means a plain clone works on a direct connection.
# ---------------------------------------------------------------------------
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7896
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7896
